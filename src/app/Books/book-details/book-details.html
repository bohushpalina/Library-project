<div *ngIf="book; else notFound" class="card mt-3">
  <div class="card-body">
    <h2>{{ book.name }}</h2>
    <p class="text-muted">id: {{ book.id }}</p>
    <p class="text-muted">Автор: {{ book.author }}</p>
    <a routerLink="/" class="btn btn-secondary me-2">Назад к списку</a>
    <a [routerLink]="['/book/edit', book.id]" class="btn btn-warning">Редактировать</a>
  </div>
</div>

<ng-template #notFound>
  <div class="alert alert-danger mt-3">
    Книга не найдена!
    <a routerLink="/" class="alert-link ms-2">Вернуться к списку</a>
  </div>
</ng-template>
