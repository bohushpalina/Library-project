<!-- Верхняя панель списка -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="page-title">Список книг</h3>
  <a routerLink="/book/add" class="btn btn-add-book">+ Добавить книгу</a>
</div>

<!-- Сетка карточек -->
<div class="books-grid">
  <div *ngFor="let book of books; let i = index" class="book-card">
    
    <!-- Обложка -->
    <div class="book-cover">
      <div class="book-spine"></div>
      <div class="book-cover-content">
        <img src="book.png" alt="Книга" class="book-icon-img">
      </div>
    </div>

    <!-- Детали книги -->
    <div class="book-details">
      <div class="book-info">
        <a [routerLink]="['/book', book.id]" class="book-title">
          {{ book.name }}
        </a>
        <div class="book-author">{{ book.author }}</div>
      </div>

      <div class="book-actions">
        <a [routerLink]="['/book/edit', book.id]" class="btn-action edit" title="Редактировать">
          ✎
        </a>
        <button (click)="deleteBook(book.id)" class="btn-action delete" title="Удалить">
          ✕
        </button>
      </div>
    </div>

  </div>
</div>
