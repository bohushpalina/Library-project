<!-- Верхняя панель списка -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="page-title">Список книг</h3>
  <a routerLink="/book/add" class="btn btn-add-book">+ Добавить книгу</a>
</div>

<!-- Сетка книг -->
<div class="books-grid">
  <!-- 🎨 Цвет берётся по id книги — та же формула, что на странице деталей -->
  <div *ngFor="let book of books; let i = index"
       class="book-card"
       [style.--book-color]="['#3D1E0B','#522108','#5C1D18','#4A2040','#2C3A2C','#612B11','#732A19','#3B2820'][(book.id || 0) % 8]">

    <!-- Кликабельная книга -->
    <a [routerLink]="['/book', book.id]" class="book-spine-wrapper">

      <!-- 1. Закрытая книга -->
      <div class="closed-book-part">
        <div class="book-spine-bg"></div>
        <img src="/book_pr.png" alt="Книга" class="book-icon-img spine-img">
      </div>

      <!-- 2. Открытая книга -->
      <div class="opened-book-wrapper">
        <div class="opened-book-bg"></div>
        <img src="/opened_book_obv.png" alt="Открытая книга" class="book-icon-img cover-img">
      </div>

    </a>

    <!-- 📜 Статичное окошко в стиле облачка (рамка 2px, размытие, перенос строк) -->
    <div class="book-info-card">
      <div class="book-title">{{ book.name }}</div>
      <div *ngIf="book.author" class="book-author">{{ book.author }}</div>
    </div>

    <!-- 🎮 Пиксельные кнопки управления под окошком -->
    <div class="pixel-actions">
      <a [routerLink]="['/book/edit', book.id]" class="btn-pixel edit" title="Редактировать">
        ✎
      </a>
      <button (click)="deleteBook(book.id)" class="btn-pixel delete" title="Удалить">
        ✕
      </button>
    </div>

  </div>
</div>
