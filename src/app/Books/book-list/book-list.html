<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Список книг:</h3>
  <a routerLink="/book/add" class="btn btn-primary">+ Добавить книгу</a>
</div>

<ul class="list-group">
  <li *ngFor="let book of books" class="list-group-item d-flex justify-content-between align-items-center">
    <div>
      <a [routerLink]="['/book', book.id]" class="fw-bold text-decoration-none me-2">
        {{ book.name }}
      </a>
      <span class="text-muted">({{ book.author }})</span>
    </div>

    <div>
      <a [routerLink]="['/book/edit', book.id]" class="btn btn-sm btn-outline-warning me-2">
        Редактировать
      </a>
      <button (click)="deleteBook(book.id)" class="btn btn-sm btn-outline-danger">
        Удалить
      </button>
    </div>
  </li>
</ul>
